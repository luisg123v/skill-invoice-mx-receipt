[dependency-groups]
test = [
    "playwright",
    "pytest",
    "tomli; python_version < '3.11'",
]

[tool.black]
line-length = 119

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    # summarize everything that did not plainly pass
    "-ra",
    # tracebacks without the surrounding context
    "--tb=short",
]
